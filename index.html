<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Car Wash QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 25px 20px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 50%;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 25px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    #reader {
      width: 100%;
    }

    .message {
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: #fef3c7;
      text-align: center;
      line-height: 1.5;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #f0fdf4;
    }

    .result-name {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .result-line {
      margin: 8px 0;
      font-size: 15px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="header">

    <div class="logo">
      🚗
    </div>

    <h1>Car Wash QR Scanner</h1>

    <div class="subtitle">
      Scan the customer's QR code
    </div>

  </div>


  <div class="card">

    <div id="reader"></div>


    <div
      id="message"
      class="message hidden">
    </div>


    <div
      id="result"
      class="result hidden">

      <div
        id="customerName"
        class="result-name">
      </div>

      <div
        id="customerID"
        class="result-line">
      </div>

      <div
        id="vehicleID"
        class="result-line">
      </div>

      <div
        id="vehicle"
        class="result-line">
      </div>

      <div
        id="plate"
        class="result-line">
      </div>

      <div
        id="colour"
        class="result-line">
      </div>


      <button
        class="primary"
        onclick="scanAgain()">

        SCAN ANOTHER CUSTOMER

      </button>

    </div>

  </div>

</div>


<script>


/*
==================================================
BACKEND
==================================================
*/

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbxfpQTl7qV-T0mKcLUTR1sF4ED9TK6pv1YIP1hvXyXq4Vtmu7SvyqtqWUu7uwzJZgHz/exec";


let scanner = null;

let scanning = false;


/*
==================================================
MESSAGES
==================================================
*/

function showMessage(text) {

  const message =
    document.getElementById("message");

  message.innerText = text;

  message.classList.remove("hidden");

}


function hideMessage() {

  document
    .getElementById("message")
    .classList
    .add("hidden");

}


/*
==================================================
EXTRACT CUSTOMER ID
==================================================
*/

function extractCustomerID(decodedText) {

  decodedText =
    String(decodedText || "").trim();


  /*
   * CASE 1:
   * QR contains a URL
   *
   * Example:
   * https://.../exec?customer=C000003
   */

  try {

    const url =
      new URL(decodedText);

    const customer =
      url.searchParams.get("customer");

    if (customer) {

      return customer
        .trim()
        .toUpperCase();

    }

  } catch (error) {

    /*
     * Not a URL.
     * Continue below.
     */

  }


  /*
   * CASE 2:
   * QR contains only:
   *
   * C000003
   */

  return decodedText
    .trim()
    .toUpperCase();

}


/*
==================================================
SCAN SUCCESS
==================================================
*/

function onScanSuccess(decodedText) {

  if (!decodedText || !scanning) {

    return;

  }


  scanning = false;


  if (scanner) {

    scanner
      .stop()
      .catch(() => {});

  }


  const customerID =
    extractCustomerID(decodedText);


  if (!customerID) {

    showMessage(
      "Invalid customer QR code."
    );

    scanning = false;

    startScanner();

    return;

  }


  /*
   * Show exactly what we are looking up.
   */

  showMessage(
    "Customer ID: " +
    customerID +
    "\n\nLoading customer details..."
  );


  lookupCustomer(customerID);

}


/*
==================================================
SCAN FAILURE
==================================================
*/

function onScanFailure(error) {

  /*
   * Normal camera scanning failures
   * are ignored.
   */

}


/*
==================================================
LOOK UP CUSTOMER
==================================================
*/

function lookupCustomer(customerID) {


  /*
   * Create a unique JSONP callback.
   */

  const callbackName =
    "carWashCustomer_" +
    Date.now();


  /*
   * Create callback function.
   */

window[callbackName] =
    function(data) {


      delete window[callbackName];


      /*
       * Remove script tag.
       */

      const script =
        document.getElementById(
          callbackName
        );


      if (script) {

        script.remove();

      }


      /*
       * No response.
       */

      if (!data) {

        showMessage(
          "No response received from the customer database."
        );

        return;

      }


      /*
       * Backend says customer wasn't found.
       */

      if (data.success !== true) {

        showMessage(
          data.message ||
          "Customer not found."
        );

        return;

      }


      /*
       * Customer found.
       */

      displayCustomer(data);

    };


  /*
   * Build backend request.
   */

  const requestURL =
    BACKEND_URL +
    "?customer=" +
    encodeURIComponent(customerID) +
    "&callback=" +
    callbackName;


  /*
   * Create JSONP script.
   */

  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    requestURL;


  /*
   * Backend connection failure.
   */

  script.onerror =
    function() {

      delete window[callbackName];

      script.remove();

      showMessage(
        "Unable to connect to the Car Wash customer database."
      );

    };


  /*
   * Timeout protection.
   */

  setTimeout(
    function() {

      if (
        document.getElementById(
          callbackName
        )
      ) {

        delete window[callbackName];

        script.remove();

        showMessage(
          "The customer database took too long to respond. Please try again."
        );

      }

    },
    10000
  );


  /*
   * Send request.
   */

  document
    .body
    .appendChild(script);

}

function displayCustomer(data) {
  /*
   * The backend returns a flat object:
   *
   * customerName
   * customerID
   * vehicleID
   * vehicle
   * plate
   * colour
   * vehicleType
   */
  document
    .getElementById("customerName")
    .innerText =
      data.customerName || "Customer";
  document
    .getElementById("customerID")
    .innerText =
      "Customer ID: " +
      (data.customerID || "");
  document
    .getElementById("vehicleID")
    .innerText =
      "Vehicle ID: " +
      (data.vehicleID || "");
  document
    .getElementById("vehicle")
    .innerText =
      "Vehicle: " +
      (data.vehicle || "");
  document
    .getElementById("plate")
    .innerText =
      "Plate: " +
      (data.plate || "");
  document
    .getElementById("colour")
    .innerText =
      "Colour: " +
      (data.colour || "");
  /*
   * Hide scanner.
   */
  document
    .getElementById("reader")
    .classList
    .add("hidden");
  /*
   * Hide loading message.
   */
  document
    .getElementById("message")
    .classList
    .add("hidden");
  /*
   * Show customer details.
   */
  document
    .getElementById("result")
    .classList
    .remove("hidden");
}

/*
==================================================
SCAN AGAIN
==================================================
*/

function scanAgain() {

  document
    .getElementById("result")
    .classList
    .add("hidden");


  startScanner();

}


/*
==================================================
START CAMERA
==================================================
*/

function startScanner() {


  hideMessage();


  document
    .getElementById("result")
    .classList
    .add("hidden");


  document
    .getElementById("reader")
    .classList
    .remove("hidden");


  scanning = false;


  /*
   * Destroy previous scanner instance.
   */

  if (scanner) {

    scanner
      .clear()
      .catch(() => {});

  }


  scanner =
    new Html5Qrcode("reader");


  scanner
    .start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess,

      onScanFailure

    )


    .then(
      function() {

        scanning = true;

      }
    )


    .catch(
      function(error) {

        console.error(error);

        scanning = false;

        showMessage(
          "Unable to open the camera. Please allow camera access and try again."
        );

      }
    );

}


/*
==================================================
START APPLICATION
==================================================
*/

window.onload =
  function() {

    startScanner();

  };

</script>

</body>

</html>
